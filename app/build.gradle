plugins {
    id "com.android.application"
}

android {
    namespace "io.github.chenxiaoming233.hyperlink"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.chenxiaoming233.hyperlink"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly project(":xposed-api-stub")
    testImplementation "junit:junit:4.13.2"
}
